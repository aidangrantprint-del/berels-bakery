# Decap CMS settings for berelsbakery.com/admin
# Asher logs in with GitHub and flips the sold-out switches in products.json.
# Each Publish saves a commit to GitHub, and Netlify redeploys the site (~1 min).

backend:
  name: github
  repo: aidangrantprint-del/berels-bakery
  branch: main
  commit_messages:
    update: "Update sold-out switches (via /admin)"

site_url: https://berelsbakery.com
display_url: https://berelsbakery.com
logo_url: https://berelsbakery.com/images/favicon.png

# Required by Decap even though nothing is uploaded here.
media_folder: images
public_folder: /images

collections:
  - name: stock
    label: Shop Settings
    delete: false
    editor:
      preview: false
    files:
      - name: products
        label: Sold-out switches
        file: products.json
        format: json
        description: >
          Switch an item ON to mark it as SOLD OUT on the website, then click Publish.
          The site updates about a minute later. Switch it back OFF when it's available again.
        fields:
          - { name: white_sourdough,       label: "White Sourdough Loaf — sold out",  widget: boolean, default: false }
          - { name: seeded_sourdough,      label: "Seeded Sourdough Loaf — sold out", widget: boolean, default: false }
          - { name: choc_chunk_cookie,     label: "Choc Chunk Cookie — sold out",     widget: boolean, default: false }
          - { name: cinnamon_scroll,       label: "Cinnamon Scroll — sold out",       widget: boolean, default: false }
          - { name: cinnamon_scroll_icing, label: "Cream cheese icing (for scrolls) — sold out", widget: boolean, default: false, hint: "Plain scrolls can still be ordered." }

      - name: limits
        label: Order limits
        file: limits.json
        format: json
        description: >
          Choose how much of each item people can order, then click Publish.
          The site updates about a minute later. Prices can't be changed here.
        fields:
          - { name: white_sourdough_max,  label: "White Sourdough Loaf — most loaves per order",  widget: number, value_type: int, min: 1, max: 20, default: 2 }
          - { name: seeded_sourdough_max, label: "Seeded Sourdough Loaf — most loaves per order", widget: number, value_type: int, min: 1, max: 20, default: 2 }
          - { name: choc_chunk_cookie_pack_1,  label: "Choc Chunk Cookie — allow 1 cookie",   widget: boolean, default: true }
          - { name: choc_chunk_cookie_pack_4,  label: "Choc Chunk Cookie — allow pack of 4",  widget: boolean, default: true }
          - { name: choc_chunk_cookie_pack_6,  label: "Choc Chunk Cookie — allow pack of 6",  widget: boolean, default: true }
          - { name: choc_chunk_cookie_pack_12, label: "Choc Chunk Cookie — allow pack of 12", widget: boolean, default: true }
          - { name: cinnamon_scroll_pack_1, label: "Cinnamon Scroll — allow 1 scroll",  widget: boolean, default: true }
          - { name: cinnamon_scroll_pack_3, label: "Cinnamon Scroll — allow pack of 3", widget: boolean, default: true, hint: "If every pack size of an item is switched off, it shows as Sold out." }
          - { name: cinnamon_scroll_pack_6, label: "Cinnamon Scroll — allow pack of 6", widget: boolean, default: true }
